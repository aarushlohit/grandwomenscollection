name: Secure CI and deployment

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Configure Java for Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        run: npm ci

      - name: Install function dependencies
        run: |
          npm ci --prefix functions
          npm ci --prefix honeypot

      - name: Verify frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Verify Cloud Functions
        run: |
          npm run build --prefix functions
          npm run build --prefix honeypot

      - name: Test Firebase security rules in emulators
        run: npx firebase-tools@15.26.0 emulators:exec --only firestore,storage --project demo-grand-womens "npx vitest run --config vitest.firebase.config.ts"

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix functions --omit=dev --audit-level=high
          npm audit --prefix honeypot --omit=dev --audit-level=high

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Deploy Firebase backend
        run: npx firebase-tools@15.26.0 deploy --only functions:backend,firestore:rules,firestore:indexes,storage --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Build and deploy Vercel frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@58.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@58.9.0 build --prod --token="$VERCEL_TOKEN"
          npx vercel@58.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Send deployment status alert
        if: always()
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          DEPLOYMENT_STATUS: ${{ job.status }}
          DEPLOYMENT_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOYMENT_WEBHOOK_URL" ] || [ -z "$DEPLOYMENT_WEBHOOK_SECRET" ]; then exit 0; fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({status: process.env.DEPLOYMENT_STATUS, commit: process.env.DEPLOYMENT_COMMIT, environment: "production"}))')
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DEPLOYMENT_WEBHOOK_SECRET" -hex | awk '{print $2}')
          curl --fail --silent --show-error --request POST "$DEPLOYMENT_WEBHOOK_URL" --header "content-type: application/json" --header "x-grand-signature: $signature" --data "$payload"
